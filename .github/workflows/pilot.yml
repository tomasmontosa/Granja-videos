name: Build and upload pilot Short

on:
workflow_dispatch:

No activar publicaciones programadas hasta comprobar que funciona.

schedule:

- cron: "0 15 * * *"

jobs:
build-upload:
runs-on: ubuntu-latest
timeout-minutes: 20

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Install Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install FFmpeg
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg fonts-dejavu-core

  - name: Install Python packages
    run: pip install -r requirements.txt

  - name: Render and upload as private
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SCRIPT_FILE: scripts/sol_desaparece.json
    run: python main.py
